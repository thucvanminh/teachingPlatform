<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D1A"/>
      <stop offset="50%" stop-color="#0A1526"/>
      <stop offset="100%" stop-color="#140A26"/>
    </linearGradient>

    <!-- Bromine Solution Gradient (Reddish Orange) -->
    <linearGradient id="bromineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9A3412" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="340" rx="16" fill="url(#bgGrad3)" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="20" y="14" width="640" height="34" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="340" y="36" text-anchor="middle" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" filter="url(#glowOrange)">
    STATION 3: TYPE 2 • THE BROMINE (Br₂) LIQUID TRAP CHAMBER FOR HYDROCARBONS
  </text>

  <!-- LEFT: Gas Bubbler Chamber -->
  <g transform="translate(35, 60)">
    <!-- Gas Inlet Tube -->
    <path d="M 0 50 L 50 50 L 50 170" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <rect x="-10" y="35" width="55" height="30" rx="6" fill="#0369A1" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="17" y="54" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">INLET</text>
    <text x="17" y="80" text-anchor="middle" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">CH₄ + C₂H₄</text>

    <!-- Bubbler Flask -->
    <path d="M 30 70 L 60 70 L 85 130 L 160 130 L 185 70 L 215 70 L 225 210 Q 225 225, 205 225 L 40 225 Q 20 225, 20 210 Z" fill="#0B132B" stroke="#A78BFA" stroke-width="2" opacity="0.95"/>
    
    <!-- Bromine Liquid -->
    <path d="M 23 150 Q 80 145, 125 150 T 222 150 L 223 210 Q 223 223, 205 223 L 40 223 Q 23 223, 23 210 Z" fill="url(#bromineGrad)" stroke="#F97316" stroke-width="1"/>
    <text x="122" y="195" text-anchor="middle" fill="#FED7AA" font-family="system-ui, sans-serif" font-size="12" font-weight="900">Br₂ Solution</text>

    <!-- Bubbles in Liquid: C2H4 reacting, CH4 escaping -->
    <circle cx="55" cy="180" r="4.5" fill="#FED7AA" filter="url(#glowOrange)"/>
    <circle cx="75" cy="165" r="5" fill="#38BDF8" filter="url(#glowCyan3)"/>
    <circle cx="95" cy="175" r="4" fill="#FED7AA"/>
    <circle cx="140" cy="160" r="5.5" fill="#38BDF8" filter="url(#glowCyan3)"/>

    <!-- Exhaust Gas Outlet Tube (CH4 Escapes) -->
    <path d="M 195 70 L 195 20 L 255 20" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round"/>
    <rect x="235" y="5" width="55" height="30" rx="6" fill="#065F46" stroke="#10B981" stroke-width="1.2"/>
    <text x="262" y="24" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">OUTLET</text>
    <text x="262" y="50" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">CH₄ Only ↑</text>

    <!-- Digital Balance Sensor below Flask -->
    <rect x="35" y="235" width="175" height="35" rx="6" fill="#020617" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="122" y="257" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      Scale Δm = +2.8 g (C₂H₄)
    </text>
  </g>

  <!-- RIGHT: Chemical Logic & Calculations -->
  <g transform="translate(345, 60)">
    <!-- Mechanism Cards -->
    <rect x="0" y="0" width="305" height="72" rx="10" fill="#1E1B4B" stroke="#6D28D9" stroke-width="1.5"/>
    <text x="14" y="20" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">MOLECULAR BOND SECRETS:</text>
    <text x="14" y="38" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11">
      • <tspan fill="#F472B6" font-weight="bold">C₂H₄ (Alkene):</tspan> Weak C=C bond → <tspan fill="#F59E0B" font-weight="bold">TRAPPED in Br₂</tspan>
    </text>
    <text x="14" y="58" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11">
      • <tspan fill="#67E8F9" font-weight="bold">CH₄ (Alkane):</tspan> Strong C-H bonds → <tspan fill="#34D399" font-weight="bold">PASSES OUT CLEANLY</tspan>
    </text>

    <!-- 2 Golden Clues Box -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="305" height="150" rx="10" fill="#090E1A" stroke="#0E7490" stroke-width="1.2"/>
      
      <text x="14" y="22" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
        THE 2 GOLDEN TELEMETRY CLUES:
      </text>

      <text x="14" y="44" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11">
        <tspan fill="#F59E0B" font-weight="bold">1. Flask Mass Increase (Δm):</tspan>
      </text>
      <text x="24" y="62" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">
        Δm = m(C₂H₄) = 2.8 g → n(C₂H₄) = 2.8 / 28 = <tspan fill="#34D399" font-weight="bold">0.1 mol</tspan>
      </text>

      <text x="14" y="86" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11">
        <tspan fill="#38BDF8" font-weight="bold">2. Escaping Gas (Exit Flow):</tspan>
      </text>
      <text x="24" y="104" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">
        n(mix) = 7.437 / 24.79 = 0.3 mol
      </text>
      <text x="24" y="122" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">
        → n(CH₄) = 0.3 - 0.1 = <tspan fill="#67E8F9" font-weight="bold">0.2 mol (3.2 g)</tspan>
      </text>

      <rect x="10" y="128" width="285" height="18" rx="4" fill="#020617"/>
      <text x="152" y="141" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">
        %m(C₂H₄) = <tspan fill="#F59E0B">46.67%</tspan>  |  %m(CH₄) = <tspan fill="#38BDF8">53.33%</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Equation Summary -->
  <g transform="translate(20, 290)">
    <rect x="0" y="0" width="640" height="38" rx="8" fill="#042F2E" stroke="#10B981" stroke-width="1.2"/>
    <text x="25" y="24" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      REACTION:
    </text>
    <text x="110" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11">
      C₂H₄ + Br₂ (brown liquid) → C₂H₄Br₂ (colorless liquid trapped)  |  CH₄ + Br₂ → No Reaction
    </text>
  </g>
</svg>
