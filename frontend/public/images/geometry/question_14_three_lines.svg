<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#03060D" />
    </linearGradient>
    <marker id="arrowCyan14" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 1,1 L 5,3 L 1,5 Z" fill="#38BDF8" />
    </marker>
    <marker id="arrowPurple14" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 1,1 L 5,3 L 1,5 Z" fill="#C084FC" />
    </marker>
    <marker id="arrowAmber14" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 1,1 L 5,3 L 1,5 Z" fill="#FBBF24" />
    </marker>
    <filter id="glow14" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="536" height="316" rx="20" fill="url(#bgGrad14)" stroke="#0E7490" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Title / Legend Banner -->
  <rect x="110" y="14" width="320" height="28" rx="8" fill="#0E2238" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.6" />
  <text x="270" y="33" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
    FIGURE: THREE LINES AB, CD, EF INTERSECTING AT O
  </text>

  <!-- Lines intersecting at (270, 160) -->
  <!-- Line 1: AB (Horizontal) -->
  <line x1="50" y1="160" x2="490" y2="160" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrowCyan14)" />
  <!-- Line 2: CD (Angle ~ 60 deg) -->
  <line x1="170" y1="35" x2="370" y2="285" stroke="#C084FC" stroke-width="3" marker-end="url(#arrowPurple14)" />
  <!-- Line 3: EF (Angle ~ 150 deg) -->
  <line x1="140" y1="240" x2="400" y2="80" stroke="#FBBF24" stroke-width="3" marker-end="url(#arrowAmber14)" />

  <!-- Angle Arcs -->
  <!-- AOE = 30 deg between OA (left) and OE (down-left) -->
  <path d="M 220,160 A 50,50 0 0,1 226.7,185" fill="none" stroke="#F59E0B" stroke-width="2.5" />
  <text x="185" y="180" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">30°</text>

  <!-- COF = 70 deg between OC (up-left) and OF (up-right) -->
  <path d="M 235,116 A 50,50 0 0,1 311,134" fill="none" stroke="#34D399" stroke-width="2.5" />
  <text x="270" y="105" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">70°</text>

  <!-- Unknown Target: BOD -->
  <path d="M 320,160 A 50,50 0 0,1 305,197" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="4,2" />
  <text x="345" y="185" fill="#F87171" font-family="system-ui, sans-serif" font-size="14" font-weight="800">? (BOD)</text>

  <!-- Point Markers & Labels -->
  <circle cx="270" cy="160" r="5" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2" filter="url(#glow14)" />
  <text x="270" y="150" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">O</text>

  <text x="60" y="150" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">A</text>
  <text x="480" y="150" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">B</text>
  <text x="180" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">C</text>
  <text x="360" y="275" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">D</text>
  <text x="135" y="260" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">E</text>
  <text x="410" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800">F</text>
</svg>
