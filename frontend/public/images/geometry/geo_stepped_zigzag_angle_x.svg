  <circle cx="260.00" cy="160.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
  <circle cx="260.00" cy="160.00" r="4.5" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.5" />
  <text x="242.00" y="160.00" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">M</text>
