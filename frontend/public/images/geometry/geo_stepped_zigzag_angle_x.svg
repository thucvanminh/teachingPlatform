<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 540 320" width="100%" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Geometric Diagram">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06B6D4" stroke-width="0.8" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="320" rx="18" fill="url(#cosmicBg)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.35" />
  <rect width="540" height="320" rx="18" fill="url(#radarGrid)" />

  <!-- Geometric Elements -->
  <line x1="80.00" y1="80.00" x2="460.00" y2="80.00" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round" />
  <line x1="80.00" y1="240.00" x2="460.00" y2="240.00" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round" />
  <line x1="80.00" y1="80.00" x2="260.00" y2="160.00" stroke="#C4B5FD" stroke-width="2.8" stroke-linecap="round" />
  <line x1="260.00" y1="160.00" x2="80.00" y2="240.00" stroke="#C4B5FD" stroke-width="2.8" stroke-linecap="round" />
  <line x1="260.00" y1="160.00" x2="460.00" y2="160.00" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5,5" />
  <text x="472.00" y="164.00" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">z</text>
  <path d="M 300.50 84.00 L 308.50 80.00 L 300.50 76.00" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 307.50 84.00 L 315.50 80.00 L 307.50 76.00" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 300.50 244.00 L 308.50 240.00 L 300.50 236.00" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 307.50 244.00 L 315.50 240.00 L 307.50 236.00" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="472.00" y="84.00" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">x</text>
  <text x="472.00" y="244.00" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">y</text>
  <circle cx="80.00" cy="80.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
