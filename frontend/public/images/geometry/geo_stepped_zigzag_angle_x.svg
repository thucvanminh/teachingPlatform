  <path d="M 260.00 160.00 L 232.59 172.18 A 30.00 30.00 0 0 1 232.59 147.82 Z" fill="rgba(245, 158, 11, 0.22)" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  <text x="206.00" y="160.00" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">x = 95°</text>

  <!-- Schematic Watermark -->
  <text x="18" y="306" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1">SCHEMATIC · NOT TO SCALE</text>
</svg>