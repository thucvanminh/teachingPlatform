<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" height="100%" role="img" aria-label="Consecutive Interior Angles">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E172A"/>
    </linearGradient>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="440" rx="20" fill="url(#bgGrad3)" stroke="#EC4899" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Top Title Banner -->
  <rect x="130" y="18" width="460" height="36" rx="18" fill="#0F172A" stroke="#EC4899" stroke-width="1.5"/>
  <text x="360" y="42" fill="#F472B6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.5">CONSECUTIVE INTERIOR ANGLES · U-SHAPE</text>

  <!-- U / Bracket Shape Glow Path -->
  <path d="M 480 140 L 382 140 L 293 280 L 420 280" fill="none" stroke="#EC4899" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.2"/>

  <!-- Interior Zone Shading -->
  <rect x="60" y="140" width="600" height="140" fill="#EC4899" fill-opacity="0.05" stroke="#EC4899" stroke-dasharray="6 6" stroke-opacity="0.2"/>
  <text x="90" y="215" fill="#EC4899" fill-opacity="0.3" font-family="system-ui" font-size="12" font-weight="bold" letter-spacing="2">INTERIOR ZONE</text>

  <!-- Parallel Lines a and b -->
  <line x1="60" y1="140" x2="660" y2="140" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <text x="675" y="146" fill="#38BDF8" font-family="system-ui" font-size="20" font-weight="bold">a</text>

  <line x1="60" y1="280" x2="660" y2="280" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <text x="675" y="286" fill="#38BDF8" font-family="system-ui" font-size="20" font-weight="bold">b</text>

  <!-- Parallel Arrows -->
  <path d="M 140 133 L 150 140 L 140 147 M 150 133 L 160 140 L 150 147" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 140 273 L 150 280 L 140 287 M 150 273 L 160 280 L 150 287" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Transversal line c -->
  <line x1="220" y1="390" x2="440" y2="50" stroke="#C084FC" stroke-width="3.5" stroke-linecap="round"/>
  <text x="450" y="58" fill="#C084FC" font-family="system-ui" font-size="20" font-weight="bold">c</text>

  <!-- Intersection Nodes -->
  <circle cx="382" cy="140" r="5.5" fill="#FFF"/>
  <text x="360" y="128" fill="#E2E8F0" font-family="system-ui" font-size="16" font-weight="bold">A</text>

  <circle cx="293" cy="280" r="5.5" fill="#FFF"/>
  <text x="265" y="295" fill="#E2E8F0" font-family="system-ui" font-size="16" font-weight="bold">B</text>

  <!-- Angle A4 (Bottom-Right of Node A, Obtuse) -->
  <path d="M 382 140 L 355 182 A 50 50 0 0 0 432 140 Z" fill="#F43F5E" fill-opacity="0.4" stroke="#F43F5E" stroke-width="2"/>
  <text x="405" y="180" fill="#FB7185" font-family="system-ui" font-size="18" font-weight="800" filter="url(#glowRose)">∠A₄</text>

  <!-- Angle B1 (Top-Right of Node B, Acute) -->
  <path d="M 343 280 A 50 50 0 0 0 320 238 L 293 280 Z" fill="#34D399" fill-opacity="0.4" stroke="#34D399" stroke-width="2"/>
  <text x="348" y="252" fill="#34D399" font-family="system-ui" font-size="18" font-weight="800">∠B₁</text>

  <!-- Bottom Core Property Box -->
  <rect x="120" y="365" width="480" height="48" rx="14" fill="#36081E" fill-opacity="0.85" stroke="#F43F5E" stroke-width="2"/>
  <text x="360" y="396" fill="#FFE4E6" font-family="monospace, system-ui" font-size="19" font-weight="bold" text-anchor="middle">a ∥ b  ⟹  ∠A₄ + ∠B₁ = 180°</text>
</svg>