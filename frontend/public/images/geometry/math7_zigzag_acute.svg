<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Auxiliary Parallel Ray Exercise</title>
  <desc id="desc">Ray Ax is parallel to Ray By. Vertex O is between them with angle xAO = 40 degrees and yBO = 50 degrees. Find angle AOB.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="540" height="320" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Ray Ax -->
  <line x1="120" y1="80" x2="480" y2="80" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="80" r="4.5" fill="#FFFFFF"/>
  <text x="103" y="85" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">A</text>
  <text x="490" y="85" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">x</text>

  <!-- Ray By -->
  <line x1="120" y1="240" x2="480" y2="240" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="240" r="4.5" fill="#FFFFFF"/>
  <text x="103" y="245" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">B</text>
  <text x="490" y="245" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">y</text>

  <!-- Vertex O -->
  <circle cx="240" cy="160" r="6" fill="#22D3EE" filter="url(#neonGlow)"/>
  <circle cx="240" cy="160" r="3" fill="#FFFFFF"/>
  <text x="218" y="165" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">O</text>

  <!-- Segments AO and BO -->
  <line x1="120" y1="80" x2="240" y2="160" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="240" x2="240" y2="160" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>

  <!-- Angle xAO = 40° -->
  <path d="M 120 80 L 160 80 A 40 40 0 0 1 153 102 Z" fill="rgba(56,189,248,0.25)" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="172" y="98" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold">40°</text>

  <!-- Angle yBO = 50° -->
  <path d="M 120 240 L 160 240 A 40 40 0 0 0 153 218 Z" fill="rgba(245,158,11,0.25)" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="172" y="232" fill="#F59E0B" font-family="monospace" font-size="13" font-weight="bold">50°</text>

  <!-- Angle AOB arc -->
  <path d="M 240 160 L 210 140 A 36 36 0 0 1 210 180 Z" fill="rgba(236,72,153,0.28)" stroke="#F472B6" stroke-width="2"/>
  <text x="255" y="165" fill="#F472B6" font-family="monospace" font-size="14" font-weight="bold">∠AOB = ?</text>

  <!-- Banner -->
  <rect x="135" y="15" width="270" height="28" rx="14" fill="#0F172A" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="270" y="34" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ax ∥ By · FIND ∠AOB</text>
</svg>
