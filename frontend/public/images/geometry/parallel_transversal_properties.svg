<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Properties of Parallel Lines Cut by a Transversal</title>
  <desc id="desc">Lines a and b are parallel, cut by transversal c at A and B. Alternate interior angles are equal, corresponding angles are equal, and consecutive interior angles are supplementary.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Backdrop -->
  <rect width="540" height="320" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Interior Zone Highlight -->
  <rect x="35" y="100" width="470" height="120" fill="#0C2135" fill-opacity="0.45" rx="6"/>
  <text x="45" y="165" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">INTERIOR REGION</text>

  <!-- Parallel Lines a and b -->
  <!-- Line a -->
  <line x1="35" y1="100" x2="505" y2="100" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 430 95 L 438 100 L 430 105 M 440 95 L 448 100 L 440 105" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <text x="512" y="105" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">a</text>

  <!-- Line b -->
  <line x1="35" y1="220" x2="505" y2="220" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 430 215 L 438 220 L 430 225 M 440 215 L 448 220 L 440 225" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <text x="512" y="225" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">b</text>

  <!-- Transversal Line c -->
  <line x1="195" y1="295" x2="330" y2="25" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
  <text x="336" y="35" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">c</text>

  <!-- Alternate Interior "Z" Highlights: A3 and B1 in Cyan/Amber -->
  <!-- Arc for A3 at (283, 100): angle from 180 to 245 deg -->
  <path d="M 283 100 L 253 100 A 30 30 0 0 1 270 128 Z" fill="rgba(6,182,212,0.25)" stroke="#06B6D4" stroke-width="2"/>
  <!-- Arc for B1 at (226, 220): angle from 0 to 65 deg -->
  <path d="M 226 220 L 256 220 A 30 30 0 0 0 239 192 Z" fill="rgba(6,182,212,0.25)" stroke="#06B6D4" stroke-width="2"/>

  <!-- Arc for A4 at (283, 100): consecutive interior pair -->
  <path d="M 283 100 L 311 100 A 28 28 0 0 1 295 125 Z" fill="rgba(245,158,11,0.2)" stroke="#F59E0B" stroke-width="1.8"/>

  <!-- Arc for A1 at (283, 100): corresponding to B1 -->
  <path d="M 283 100 L 313 100 A 30 30 0 0 0 296 72 Z" fill="rgba(56,189,248,0.2)" stroke="#38BDF8" stroke-width="1.8"/>

  <!-- Intersection Nodes A and B -->
  <circle cx="283" cy="100" r="5" fill="#22D3EE" filter="url(#neonGlow)"/>
  <circle cx="283" cy="100" r="2.5" fill="#FFFFFF"/>
  <text x="290" y="88" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">A</text>

  <circle cx="226" cy="220" r="5" fill="#22D3EE" filter="url(#neonGlow)"/>
  <circle cx="226" cy="220" r="2.5" fill="#FFFFFF"/>
  <text x="208" y="238" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">B</text>

  <!-- Angle Numbers & Values -->
  <!-- At Node A -->
  <text x="325" y="80" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold">A1=125°</text>
  <text x="220" y="75" fill="#94A3B8" font-family="monospace" font-size="12">A2=55°</text>
  <text x="210" y="132" fill="#06B6D4" font-family="monospace" font-size="13" font-weight="bold">A3=125°</text>
  <text x="315" y="135" fill="#F59E0B" font-family="monospace" font-size="13" font-weight="bold">A4=55°</text>

  <!-- At Node B -->
  <text x="268" y="200" fill="#06B6D4" font-family="monospace" font-size="13" font-weight="bold">B1=125°</text>
  <text x="160" y="200" fill="#F59E0B" font-family="monospace" font-size="12">B2=55°</text>
  <text x="155" y="255" fill="#94A3B8" font-family="monospace" font-size="12">B3=125°</text>
  <text x="255" y="255" fill="#94A3B8" font-family="monospace" font-size="12">B4=55°</text>

  <!-- Floating Formula Legend Cards -->
  <g transform="translate(30, 20)">
    <rect width="210" height="48" rx="8" fill="#0B1528" stroke="#06B6D4" stroke-width="1.2"/>
    <text x="12" y="20" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1. ALTERNATE INTERIOR (Z)</text>
    <text x="12" y="38" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="bold">∠A3 = ∠B1 = 125°</text>
  </g>

  <g transform="translate(30, 255)">
    <rect width="210" height="48" rx="8" fill="#0B1528" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="12" y="20" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2. CONSECUTIVE INTERIOR (U)</text>
    <text x="12" y="38" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="bold">∠A4 + ∠B1 = 180°</text>
  </g>

  <g transform="translate(325, 255)">
    <rect width="180" height="48" rx="8" fill="#0B1528" stroke="#A78BFA" stroke-width="1.2"/>
    <text x="12" y="20" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">3. CORRESPONDING (F)</text>
    <text x="12" y="38" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="bold">∠A1 = ∠B1 = 125°</text>
  </g>
</svg>
