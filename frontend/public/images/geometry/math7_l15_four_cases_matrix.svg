<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Four Right Triangle Congruence Criteria</title>
  <desc id="desc">Matrix of 4 criteria: Leg-Leg (LL), Leg-Acute Angle (LA), Hypotenuse-Acute Angle (HA), Hypotenuse-Leg (HL)</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="320" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="75" y="10" width="450" height="26" rx="13" fill="#0F172A" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="300" y="27" fill="#E2E8F0" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">CONGRUENCE CRITERIA FOR RIGHT TRIANGLES · 4 CORE CASES</text>

  <!-- Panel 1: LL (Leg - Leg) -->
  <rect x="20" y="44" width="270" height="126" rx="10" fill="rgba(15,23,42,0.6)" stroke="#38BDF8" stroke-width="1"/>
  <text x="32" y="62" fill="#38BDF8" font-family="system-ui" font-size="11" font-weight="bold">1. Leg - Leg (LL)</text>
  <path d="M 55.0 142.0 L 55.0 132.0 L 45.0 132.0" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <polygon points="45,142 125,142 45,82" fill="rgba(56,189,248,0.12)" stroke="#38BDF8" stroke-width="2"/>
  <line x1="85.0" y1="135.0" x2="85.0" y2="149.0" stroke="#34D399" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="38.0" y1="115.5" x2="52.0" y2="115.5" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="38.0" y1="108.5" x2="52.0" y2="108.5" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"/>
  <text x="142" y="118" fill="#E2E8F0" font-family="system-ui" font-size="16" font-weight="bold">=</text>
  <path d="M 185.0 142.0 L 185.0 132.0 L 175.0 132.0" fill="none" stroke="#34D399" stroke-width="2"/>
  <polygon points="175,142 255,142 175,82" fill="rgba(52,211,153,0.12)" stroke="#34D399" stroke-width="2"/>
  <line x1="215.0" y1="135.0" x2="215.0" y2="149.0" stroke="#34D399" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="168.0" y1="115.5" x2="182.0" y2="115.5" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="168.0" y1="108.5" x2="182.0" y2="108.5" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"/>
  <text x="155" y="162" fill="#94A3B8" font-family="system-ui" font-size="9.5" text-anchor="middle">Two pairs of legs equal (SAS special)</text>

  <!-- Panel 2: LA (Leg - Adjacent Acute Angle) -->
  <rect x="310" y="44" width="270" height="126" rx="10" fill="rgba(15,23,42,0.6)" stroke="#38BDF8" stroke-width="1"/>
  <text x="322" y="62" fill="#38BDF8" font-family="system-ui" font-size="11" font-weight="bold">2. Leg - Acute Angle (LA)</text>
  <path d="M 345.0 142.0 L 345.0 132.0 L 335.0 132.0" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 415 142 L 402.2 132.4 A 16 16 0 0 0 399.0 142.0 Z" fill="rgba(245,158,11,0.2)" stroke="none"/>
  <path d="M 402.2 132.4 A 16 16 0 0 0 399.0 142.0" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
  <polygon points="335,142 415,142 335,82" fill="rgba(56,189,248,0.12)" stroke="#38BDF8" stroke-width="2"/>
  <line x1="375.0" y1="135.0" x2="375.0" y2="149.0" stroke="#34D399" stroke-width="2.4" stroke-linecap="round"/>
  <text x="432" y="118" fill="#E2E8F0" font-family="system-ui" font-size="16" font-weight="bold">=</text>
  <path d="M 475.0 142.0 L 475.0 132.0 L 465.0 132.0" fill="none" stroke="#34D399" stroke-width="2"/>
  <path d="M 545 142 L 532.2 132.4 A 16 16 0 0 0 529.0 142.0 Z" fill="rgba(245,158,11,0.2)" stroke="none"/>
  <path d="M 532.2 132.4 A 16 16 0 0 0 529.0 142.0" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
  <polygon points="465,142 545,142 465,82" fill="rgba(52,211,153,0.12)" stroke="#34D399" stroke-width="2"/>
  <line x1="505.0" y1="135.0" x2="505.0" y2="149.0" stroke="#34D399" stroke-width="2.4" stroke-linecap="round"/>
  <text x="445" y="162" fill="#94A3B8" font-family="system-ui" font-size="9.5" text-anchor="middle">Equal leg &amp; adjacent acute angle (ASA)</text>

  <!-- Panel 3: HA (Hypotenuse - Acute Angle) -->
  <rect x="20" y="178" width="270" height="126" rx="10" fill="rgba(15,23,42,0.6)" stroke="#38BDF8" stroke-width="1"/>
  <text x="32" y="196" fill="#F59E0B" font-family="system-ui" font-size="11" font-weight="bold">3. Hypotenuse - Acute Angle (HA)</text>
  <path d="M 55.0 276.0 L 55.0 266.0 L 45.0 266.0" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 125 276 L 112.2 266.4 A 16 16 0 0 0 109.0 276.0 Z" fill="rgba(245,158,11,0.2)" stroke="none"/>
  <path d="M 112.2 266.4 A 16 16 0 0 0 109.0 276.0" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
  <polygon points="45,276 125,276 45,216" fill="rgba(56,189,248,0.12)" stroke="#38BDF8" stroke-width="2"/>
  <line x1="83.6" y1="253.7" x2="92.0" y2="242.5" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="249.5" x2="86.4" y2="238.3" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <text x="142" y="252" fill="#E2E8F0" font-family="system-ui" font-size="16" font-weight="bold">=</text>
  <path d="M 185.0 276.0 L 185.0 266.0 L 175.0 266.0" fill="none" stroke="#34D399" stroke-width="2"/>
  <path d="M 255 276 L 242.2 266.4 A 16 16 0 0 0 239.0 276.0 Z" fill="rgba(245,158,11,0.2)" stroke="none"/>
  <path d="M 242.2 266.4 A 16 16 0 0 0 239.0 276.0" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
  <polygon points="175,276 255,276 175,216" fill="rgba(52,211,153,0.12)" stroke="#34D399" stroke-width="2"/>
  <line x1="213.6" y1="253.7" x2="222.0" y2="242.5" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="208.0" y1="249.5" x2="216.4" y2="238.3" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <text x="155" y="296" fill="#94A3B8" font-family="system-ui" font-size="9.5" text-anchor="middle">Equal hypotenuse &amp; one acute angle</text>

  <!-- Panel 4: HL (Hypotenuse - Leg) -->
  <rect x="310" y="178" width="270" height="126" rx="10" fill="rgba(15,23,42,0.6)" stroke="#38BDF8" stroke-width="1"/>
  <text x="322" y="196" fill="#F59E0B" font-family="system-ui" font-size="11" font-weight="bold">4. Hypotenuse - Leg (HL)</text>
  <path d="M 345.0 276.0 L 345.0 266.0 L 335.0 266.0" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <polygon points="335,276 415,276 335,216" fill="rgba(56,189,248,0.12)" stroke="#38BDF8" stroke-width="2"/>
  <line x1="328.0" y1="246.0" x2="342.0" y2="246.0" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="373.6" y1="253.7" x2="382.0" y2="242.5" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="368.0" y1="249.5" x2="376.4" y2="238.3" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <text x="432" y="252" fill="#E2E8F0" font-family="system-ui" font-size="16" font-weight="bold">=</text>
  <path d="M 475.0 276.0 L 475.0 266.0 L 465.0 266.0" fill="none" stroke="#34D399" stroke-width="2"/>
  <polygon points="465,276 545,276 465,216" fill="rgba(52,211,153,0.12)" stroke="#34D399" stroke-width="2"/>
  <line x1="458.0" y1="246.0" x2="472.0" y2="246.0" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="503.6" y1="253.7" x2="512.0" y2="242.5" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="498.0" y1="249.5" x2="506.4" y2="238.3" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <text x="445" y="296" fill="#94A3B8" font-family="system-ui" font-size="9.5" text-anchor="middle">Equal hypotenuse &amp; one leg (Special Case)</text>
</svg>