<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Perpendicular Transversal Theorem Proof</title>
  <desc id="desc">Formal geometric proof: If a transversal is perpendicular to one of two parallel lines, it is perpendicular to the other.</desc>
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Deep Space Backdrop -->
  <rect width="540" height="320" rx="16" fill="url(#bgGrad3)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Left Column: Geometric Diagram -->
  <g transform="translate(20, 20)">
    <rect width="230" height="280" rx="12" fill="#0C1B2E" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="115" y="28" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">ORBITAL GRID</text>

    <!-- Transversal Line c (vertical) -->
    <line x1="85" y1="50" x2="85" y2="245" stroke="#C084FC" stroke-width="3" stroke-linecap="round"/>
    <text x="75" y="60" fill="#C084FC" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">c</text>

    <!-- Horizontal Line a -->
    <line x1="30" y1="100" x2="205" y2="100" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="212" y="105" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">a</text>
    <!-- Right Angle Symbol at A (85, 100) bottom-right -->
    <path d="M 85 114 L 99 114 L 99 100" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="85" cy="100" r="4" fill="#FACC15"/>
    <text x="70" y="105" fill="#FACC15" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">A</text>
    <text x="105" y="125" fill="#22D3EE" font-family="monospace" font-size="10" font-weight="bold">A₁=90°</text>

    <!-- Horizontal Line b -->
    <line x1="30" y1="185" x2="205" y2="185" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
    <text x="212" y="190" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">b</text>
    <!-- Target Right Angle at B (85, 185) top-left -->
    <path d="M 85 171 L 71 171 L 71 185" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="2,2"/>
    <circle cx="85" cy="185" r="4" fill="#FACC15"/>
    <text x="70" y="200" fill="#FACC15" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">B</text>
    <text x="50" y="165" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">B₁=?</text>

    <!-- Parallel Markers (Arrows on lines a and b) -->
    <path d="M 150 96 L 158 100 L 150 104" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 150 181 L 158 185 L 150 189" fill="none" stroke="#34D399" stroke-width="2"/>
    <text x="115" y="260" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Condition: a ∥ b</text>
  </g>

  <!-- Right Column: Formal Proof Matrix -->
  <g transform="translate(265, 20)">
    <rect width="255" height="280" rx="12" fill="#0C1B2E" fill-opacity="0.8" stroke="#10B981" stroke-width="1.2"/>
    <text x="127" y="28" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">FORMAL PROOF MATRIX</text>

    <!-- Table: Given & Prove -->
    <rect x="15" y="42" width="225" height="64" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <line x1="75" y1="42" x2="75" y2="106" stroke="#475569" stroke-width="1"/>
    <line x1="15" y1="74" x2="240" y2="74" stroke="#475569" stroke-width="1"/>

    <text x="45" y="62" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">GIVEN</text>
    <text x="155" y="62" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">a ∥ b, c ⊥ a (∠A₁ = 90°)</text>

    <text x="45" y="94" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PROVE</text>
    <text x="155" y="94" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">c ⊥ b (∠B₁ = 90°)</text>

    <!-- Proof Execution -->
    <rect x="15" y="118" width="225" height="142" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="25" y="138" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">PROOF EXECUTION (2 STEPS):</text>

    <text x="25" y="160" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">1. Because a ∥ b:</text>
    <text x="35" y="178" fill="#38BDF8" font-family="monospace" font-size="10.5" font-weight="bold">∠B₁ = ∠A₁ (Alternate Interior)</text>

    <text x="25" y="202" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">2. Because c ⊥ a at A:</text>
    <text x="35" y="220" fill="#38BDF8" font-family="monospace" font-size="10.5" font-weight="bold">∠A₁ = 90° ⇒ ∠B₁ = 90°</text>

    <line x1="25" y1="230" x2="230" y2="230" stroke="#334155" stroke-width="1"/>
    <text x="127" y="248" fill="#34D399" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="middle">∴ c ⊥ b (Q.E.D.)</text>
  </g>
</svg>
