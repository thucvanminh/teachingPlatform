  <path d="M 142.50 89.00 L 150.50 85.00 L 142.50 81.00" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 149.50 89.00 L 157.50 85.00 L 149.50 81.00" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 142.50 229.00 L 150.50 225.00 L 142.50 221.00" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 149.50 229.00 L 157.50 225.00 L 149.50 221.00" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="55.00" y="73.00" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">a</text>
  <text x="55.00" y="213.00" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">b</text>
  <text x="342.35" y="49.27" fill="#C4B5FD" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">c</text>
  <circle cx="307.22" cy="85.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
  <circle cx="307.22" cy="85.00" r="4.5" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.5" />
  <text x="323.22" y="73.00" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">A</text>
  <circle cx="232.78" cy="225.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
