<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Algebraic Angle Equation on Parallel Lines</title>
  <desc id="desc">Parallel lines a and b intersected by transversal c with algebraic angle expressions.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="540" height="320" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Interior Zone -->
  <rect x="35" y="100" width="470" height="120" fill="#0C2135" fill-opacity="0.45" rx="6"/>

  <!-- Parallel Lines a and b -->
  <line x1="35" y1="100" x2="505" y2="100" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <text x="512" y="105" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">a</text>
  <path d="M 430 96 L 436 100 L 430 104" fill="none" stroke="#38BDF8" stroke-width="2"/>

  <line x1="35" y1="220" x2="505" y2="220" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <text x="512" y="225" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">b</text>
  <path d="M 430 216 L 436 220 L 430 224" fill="none" stroke="#38BDF8" stroke-width="2"/>

  <!-- Transversal line c -->
  <line x1="180" y1="290" x2="340" y2="30" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
  <text x="345" y="35" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">c</text>

  <!-- Nodes A and B -->
  <circle cx="297" cy="100" r="5" fill="#22D3EE" filter="url(#neonGlow)"/>
  <text x="310" y="90" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">A</text>

  <circle cx="223" cy="220" r="5" fill="#22D3EE" filter="url(#neonGlow)"/>
  <text x="200" y="240" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">B</text>

  <!-- Consecutive interior angles A4 and B1 -->
  <!-- Arc at A4 (bottom-right of A) -->
  <path d="M 297 100 L 327 100 A 30 30 0 0 1 310 125 Z" fill="rgba(245,158,11,0.25)" stroke="#F59E0B" stroke-width="2"/>
  <text x="330" y="130" fill="#F59E0B" font-family="monospace" font-size="13" font-weight="bold">(2x + 10)°</text>

  <!-- Arc at B1 (top-right of B) -->
  <path d="M 223 220 L 253 220 A 30 30 0 0 0 238 195 Z" fill="rgba(6,182,212,0.25)" stroke="#06B6D4" stroke-width="2"/>
  <text x="260" y="200" fill="#06B6D4" font-family="monospace" font-size="13" font-weight="bold">(3x + 20)°</text>

  <!-- Top Banner -->
  <rect x="135" y="15" width="270" height="28" rx="14" fill="#0F172A" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="270" y="34" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">a ∥ b · SOLVE FOR UNKNOWN x</text>
</svg>
