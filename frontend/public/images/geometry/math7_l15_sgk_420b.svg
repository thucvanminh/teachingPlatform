<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 285" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Crossed Right Triangles Shared Base SGK 4.20b</title>
  <desc id="desc">Crossed right triangles EHG and FGH sharing hypotenuse HG with equal legs EH = FG</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="540" height="285" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4"/>
  <g transform="translate(0, -20)">
  <!-- H(130,245), G(410,245), E(186,133), F(354,133) -->
  <path d="M 180.2 144.6 L 191.8 150.4 L 197.6 138.8" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 359.8 144.6 L 348.2 150.4 L 342.4 138.8" fill="none" stroke="#34D399" stroke-width="2"/>

  <polygon points="130,245 410,245 186,133" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="130,245 410,245 354,133" fill="rgba(52,211,153,0.1)" stroke="#34D399" stroke-width="2.5"/>

  <line x1="151.7" y1="185.9" x2="164.3" y2="192.1" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="375.7" y1="192.1" x2="388.3" y2="185.9" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/>

  <circle cx="130" cy="245" r="4.5" fill="#22D3EE"/><text x="114" y="255" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">H</text>
  <circle cx="410" cy="245" r="4.5" fill="#22D3EE"/><text x="424" y="255" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">G</text>
  <circle cx="186" cy="133" r="4.5" fill="#38BDF8"/><text x="180" y="120" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">E</text>
  <circle cx="354" cy="133" r="4.5" fill="#34D399"/><text x="360" y="120" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">F</text>

  <text x="270" y="265" fill="#38BDF8" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="middle">HG</text>
  </g>
</svg>