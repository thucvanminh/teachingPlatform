  <text x="195" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">110°</text>
<text x="150" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">70°</text>
<text x="180" y="230" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">110°</text>

  <text x="15" y="250" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">SCHEMATIC · NOT TO SCALE</text>
