<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 285" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Overlapping Right Triangles LA SBT 4.31c</title>
  <desc id="desc">Overlapping right triangles NMO and PQO sharing acute angle O with MN = PQ</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="540" height="285" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4"/>
  <g transform="translate(0, -20)">
  <!-- O(80,240), M(330,240), N(330,115), P(362,240), Q(302,130) -->
  <path d="M 80 240 L 112.2 223.9 A 36 36 0 0 1 116.0 240.0 Z" fill="rgba(245,158,11,0.25)" stroke="none"/>
  <path d="M 112.2 223.9 A 36 36 0 0 1 116.0 240.0" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
  <path d="M 317.0 240.0 L 317.0 227.0 L 330.0 227.0" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 290.4 135.8 L 296.6 147.2 L 308.2 141.4" fill="none" stroke="#34D399" stroke-width="2"/>

  <!-- Bottom ray -->
  <line x1="80" y1="240" x2="460" y2="240" stroke="#94A3B8" stroke-width="2"/>
  <!-- Top ray -->
  <line x1="80" y1="240" x2="420" y2="70" stroke="#94A3B8" stroke-width="2"/>

  <!-- △NMO -->
  <polygon points="80,240 330,240 330,115" fill="rgba(56,189,248,0.12)" stroke="#38BDF8" stroke-width="2.5"/>
  <!-- △PQO -->
  <polygon points="80,240 362,240 302,130" fill="rgba(52,211,153,0.12)" stroke="#34D399" stroke-width="2.5"/>

  <!-- Staggered ticks to avoid collision at intersection: MN at t=0.25 (higher up), PQ at t=0.75 (lower down) -->
  <line x1="323.0" y1="149.8" x2="337.0" y2="149.8" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="323.0" y1="142.8" x2="337.0" y2="142.8" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="342.5" y1="218.9" x2="354.8" y2="212.2" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="339.2" y1="212.8" x2="351.5" y2="206.1" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"/>

  <circle cx="80" cy="240" r="4.5" fill="#22D3EE"/><text x="65" y="248" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">O</text>
  <circle cx="330" cy="240" r="4.5" fill="#38BDF8"/><text x="330" y="258" fill="#FFF" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">M</text>
  <circle cx="330" cy="115" r="4.5" fill="#38BDF8"/><text x="330" y="102" fill="#FFF" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">N</text>
  <circle cx="362" cy="240" r="4.5" fill="#34D399"/><text x="372" y="256" fill="#FFF" font-family="system-ui" font-size="13" font-weight="bold">P</text>
  <circle cx="302" cy="130" r="4.5" fill="#34D399"/><text x="290" y="122" fill="#FFF" font-family="system-ui" font-size="13" font-weight="bold">Q</text>
  </g>
</svg>