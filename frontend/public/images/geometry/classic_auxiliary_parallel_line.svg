<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Auxiliary Parallel Line Application - Euclid's Axiom</title>
  <desc id="desc">Given ray Ax parallel to ray By, find angle AOB by drawing auxiliary ray Ot through O parallel to Ax using Euclid's Axiom.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Backdrop -->
  <rect width="540" height="320" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Ray Ax -->
  <line x1="120" y1="80" x2="480" y2="80" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="80" r="4.5" fill="#FFFFFF"/>
  <text x="105" y="85" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">A</text>
  <text x="490" y="85" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">x</text>

  <!-- Ray By -->
  <line x1="120" y1="240" x2="480" y2="240" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="240" r="4.5" fill="#FFFFFF"/>
  <text x="105" y="245" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">B</text>
  <text x="490" y="245" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">y</text>

  <!-- Vertex O -->
  <circle cx="250" cy="160" r="6" fill="#22D3EE" filter="url(#neonGlow)"/>
  <circle cx="250" cy="160" r="3" fill="#FFFFFF"/>
  <text x="228" y="165" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">O</text>

  <!-- Segments AO and BO -->
  <line x1="120" y1="80" x2="250" y2="160" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="240" x2="250" y2="160" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>

  <!-- Auxiliary Ray Ot through O parallel to Ax and By (Dashed Yellow/Emerald) -->
  <line x1="250" y1="160" x2="480" y2="160" stroke="#34D399" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="490" y="165" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">t</text>
  <text x="320" y="150" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Auxiliary ray Ot ∥ Ax (Euclid's Axiom)</text>

  <!-- Angle arc at A: angle xAO = 35° -->
  <path d="M 120 80 L 160 80 A 40 40 0 0 1 153 100 Z" fill="rgba(56,189,248,0.25)" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="175" y="98" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">35°</text>

  <!-- Angle arc at B: angle yBO = 55° -->
  <path d="M 120 240 L 160 240 A 40 40 0 0 0 153 220 Z" fill="rgba(245,158,11,0.25)" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="175" y="232" fill="#F59E0B" font-family="monospace" font-size="12" font-weight="bold">55°</text>

  <!-- Angle arcs at O: O1 (top) and O2 (bottom) -->
  <!-- O1 alternate interior to xAO -->
  <path d="M 250 160 L 217 140 A 40 40 0 0 1 290 160 Z" fill="rgba(56,189,248,0.25)" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="270" y="145" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">O₁=35°</text>

  <!-- O2 alternate interior to yBO -->
  <path d="M 250 160 L 290 160 A 40 40 0 0 1 217 180 Z" fill="rgba(245,158,11,0.25)" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="270" y="185" fill="#F59E0B" font-family="monospace" font-size="12" font-weight="bold">O₂=55°</text>

  <!-- Result Banner at Top -->
  <rect x="120" y="15" width="300" height="34" rx="17" fill="#0B132B" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="270" y="37" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">∠AOB = ∠O₁ + ∠O₂ = 35° + 55° = 90° (Right Angle)</text>
</svg>
