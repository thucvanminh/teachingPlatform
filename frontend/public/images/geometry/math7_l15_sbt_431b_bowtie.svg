<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Bowtie Vertical Angles HA SBT 4.31b</title>
  <desc id="desc">Crossed right triangles EFG and KHG meeting at G with vertical angles and equal hypotenuses FG = HG</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="540" height="320" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="95" y="14" width="350" height="28" rx="14" fill="#0F172A" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="270" y="33" fill="#E2E8F0" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">VERTICAL ANGLES BOWTIE · HA (SBT 4.31b)</text>

  <!-- Left: E(130,95), F(130,245), G(270,170). Right at E -->
  <!-- Right: K(410,95), H(410,245), G(270,170). Right at K -->
  <path d="M 130.0 108.0 L 141.5 114.1 L 141.5 101.1" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 410.0 108.0 L 398.5 114.1 L 398.5 101.1" fill="none" stroke="#34D399" stroke-width="2"/>

  <path d="M 270 170 L 248.8 158.7 A 24 24 0 0 0 248.8 181.3 Z" fill="rgba(245,158,11,0.22)" stroke="none"/>
  <path d="M 248.8 158.7 A 24 24 0 0 0 248.8 181.3" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
  <path d="M 270 170 L 291.2 181.3 A 24 24 0 0 0 291.2 158.7 Z" fill="rgba(245,158,11,0.22)" stroke="none"/>
  <path d="M 291.2 181.3 A 24 24 0 0 0 291.2 158.7" fill="none" stroke="#F59E0B" stroke-width="2.2"/>

  <polygon points="130,95 130,245 270,170" fill="rgba(56,189,248,0.12)" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="410,95 410,245 270,170" fill="rgba(52,211,153,0.12)" stroke="#34D399" stroke-width="2.5"/>

  <line x1="194.5" y1="202.0" x2="205.5" y2="213.0" stroke="#FB7185" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="194.5" y1="213.0" x2="205.5" y2="202.0" stroke="#FB7185" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="334.5" y1="202.0" x2="345.5" y2="213.0" stroke="#FB7185" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="334.5" y1="213.0" x2="345.5" y2="202.0" stroke="#FB7185" stroke-width="2.2" stroke-linecap="round"/>

  <circle cx="130" cy="95" r="4.5" fill="#22D3EE"/><text x="115" y="92" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">E</text>
  <circle cx="130" cy="245" r="4.5" fill="#22D3EE"/><text x="115" y="258" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">F</text>
  <circle cx="410" cy="95" r="4.5" fill="#34D399"/><text x="424" y="92" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">K</text>
  <circle cx="410" cy="245" r="4.5" fill="#34D399"/><text x="424" y="258" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">H</text>
  <circle cx="270" cy="170" r="4.5" fill="#F59E0B"/><text x="270" y="156" fill="#F59E0B" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">G</text>

  <text x="270" y="298" fill="#94A3B8" font-family="system-ui" font-size="11.5" text-anchor="middle">Hypotenuses FG = HG, vertical ∠EGF = ∠KGH, right at E, K ⇒ △FEG = △HKG (HA)</text>
</svg>