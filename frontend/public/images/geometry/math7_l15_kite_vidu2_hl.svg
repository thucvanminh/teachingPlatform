<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 285" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Kite Model 2 HL SGK H.4.53</title>
  <desc id="desc">Kite ABCD with right angles at B and D, common hypotenuse AC, equal legs AB = AD</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="540" height="285" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4"/>
  <g transform="translate(0, -20)">
  <!-- Scaled coordinates: A(175,160), C(365,160), B(220,79), D(220,241) -->
  <path d="M 213.7 90.4 L 225.0 96.7 L 231.3 85.3" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 213.7 229.6 L 225.0 223.3 L 231.3 234.7" fill="none" stroke="#38BDF8" stroke-width="2"/>

  <polygon points="175,160 220,79 365,160 220,241" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" stroke-width="2.6" stroke-linejoin="round"/>
  <line x1="175" y1="160" x2="365" y2="160" stroke="#34D399" stroke-width="2.6"/>

  <line x1="191.4" y1="116.1" x2="203.6" y2="122.9" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="203.6" y1="197.1" x2="191.4" y2="203.9" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/>

  <circle cx="175" cy="160" r="4.5" fill="#22D3EE"/><text x="158" y="165" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">A</text>
  <circle cx="220" cy="79" r="4.5" fill="#22D3EE"/><text x="220" y="65" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">B</text>
  <circle cx="365" cy="160" r="4.5" fill="#22D3EE"/><text x="378" y="165" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">C</text>
  <circle cx="220" cy="241" r="4.5" fill="#22D3EE"/><text x="220" y="260" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">D</text>

  <text x="300" y="150" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">AC</text>
  </g>
</svg>