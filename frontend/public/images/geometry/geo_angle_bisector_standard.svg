<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 540 320" width="100%" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Geometric Diagram">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06B6D4" stroke-width="0.8" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="320" rx="18" fill="url(#cosmicBg)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.35" />
  <rect width="540" height="320" rx="18" fill="url(#radarGrid)" />

  <!-- Geometric Elements -->
  <line x1="140.00" y1="230.00" x2="391.14" y2="162.71" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round" />
  <line x1="140.00" y1="230.00" x2="300.60" y2="0.64" stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round" />
  <line x1="140.00" y1="230.00" x2="117.34" y2="-29.01" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round" />
  <text x="406.60" y="158.57" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">x</text>
  <text x="309.78" y="-12.47" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">z (Bisector)</text>
  <text x="115.95" y="-44.95" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">y</text>
  <circle cx="140.00" cy="230.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
  <circle cx="140.00" cy="230.00" r="4.5" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.5" />
  <text x="124.00" y="242.00" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">O</text>
  <path d="M 140.00 230.00 L 167.53 190.68 A 48.00 48.00 0 0 1 186.36 217.58 Z" fill="rgba(6, 182, 212, 0.20)" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <line x1="176.45" y1="204.48" x2="182.19" y2="200.46" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
  <text x="192.43" y="193.29" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">40°</text>
  <path d="M 140.00 230.00 L 135.82 182.18 A 48.00 48.00 0 0 1 167.53 190.68 Z" fill="rgba(6, 182, 212, 0.20)" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <line x1="151.52" y1="187.02" x2="153.33" y2="180.25" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
  <text x="156.56" y="168.18" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">40°</text>

  <!-- Schematic Watermark -->
  <text x="18" y="306" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1">SCHEMATIC · NOT TO SCALE</text>
</svg>