<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 540 320" width="100%" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Geometric Diagram">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06B6D4" stroke-width="0.8" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="320" rx="18" fill="url(#cosmicBg)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.35" />
  <rect width="540" height="320" rx="18" fill="url(#radarGrid)" />

  <!-- Geometric Elements -->
  <polygon points="220.00,65.00 100.00,240.00 440.00,240.00" fill="rgba(56, 189, 248, 0.04)" stroke="#38BDF8" stroke-width="2.8" stroke-linejoin="round" />
  <line x1="220.00" y1="65.00" x2="220.00" y2="240.00" stroke="#C4B5FD" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4,4" />
  <circle cx="220.00" cy="240.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
  <circle cx="220.00" cy="240.00" r="4.5" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.5" />
  <text x="220.00" y="256.00" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">H</text>
  <path d="M 220.00 226.00 L 234.00 226.00 L 234.00 240.00" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1.8" stroke-linejoin="miter" stroke-linecap="square" />
  <line x1="220.00" y1="65.00" x2="270.00" y2="240.00" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4,4" />
  <circle cx="270.00" cy="240.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
  <circle cx="270.00" cy="240.00" r="4.5" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.5" />
  <text x="270.00" y="256.00" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">M</text>
  <line x1="183.00" y1="245.00" x2="183.00" y2="235.00" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
  <line x1="187.00" y1="245.00" x2="187.00" y2="235.00" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
  <line x1="353.00" y1="245.00" x2="353.00" y2="235.00" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
  <line x1="357.00" y1="245.00" x2="357.00" y2="235.00" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 100.00 240.00 L 114.70 218.56 A 26.00 26.00 0 0 1 126.00 240.00 Z" fill="rgba(6, 182, 212, 0.20)" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <text x="137.16" y="220.42" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">65°</text>
  <path d="M 440.00 240.00 L 419.65 223.81 A 26.00 26.00 0 1 1 414.00 240.00 Z" fill="rgba(6, 182, 212, 0.20)" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <text x="479.65" y="253.85" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">45°</text>
  <circle cx="220.00" cy="65.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
  <circle cx="220.00" cy="65.00" r="4.5" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.5" />
  <text x="220.00" y="51.00" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">A</text>
  <circle cx="100.00" cy="240.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
