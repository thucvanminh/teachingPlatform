<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" height="100%" role="img" aria-label="Double Perpendicular Theorem">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E172A"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="440" rx="20" fill="url(#bgGrad4)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Top Title Banner -->
  <rect x="130" y="18" width="460" height="36" rx="18" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="360" y="42" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.5">DOUBLE PERPENDICULAR TO THIRD LINE</text>

  <!-- Common Perpendicular Line c -->
  <line x1="280" y1="60" x2="280" y2="380" stroke="#A78BFA" stroke-width="4" stroke-linecap="round"/>
  <text x="288" y="80" fill="#A78BFA" font-family="system-ui" font-size="22" font-weight="bold">c</text>

  <!-- Line a perpendicular to c -->
  <line x1="80" y1="150" x2="640" y2="150" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <text x="655" y="156" fill="#38BDF8" font-family="system-ui" font-size="20" font-weight="bold">a</text>

  <!-- Line b perpendicular to c -->
  <line x1="80" y1="290" x2="640" y2="290" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <text x="655" y="296" fill="#38BDF8" font-family="system-ui" font-size="20" font-weight="bold">b</text>

  <!-- Right Angle Square 1 (at intersection of a and c: 280, 150) -->
  <rect x="280" y="150" width="32" height="32" fill="#10B981" fill-opacity="0.35" stroke="#34D399" stroke-width="2.5" filter="url(#glowCyan)"/>
  <circle cx="296" cy="166" r="3.5" fill="#34D399"/>
  <text x="325" y="173" fill="#34D399" font-family="system-ui" font-size="15" font-weight="bold">90° (a ⊥ c)</text>

  <!-- Right Angle Square 2 (at intersection of b and c: 280, 290) -->
  <rect x="280" y="290" width="32" height="32" fill="#10B981" fill-opacity="0.35" stroke="#34D399" stroke-width="2.5" filter="url(#glowCyan)"/>
  <circle cx="296" cy="306" r="3.5" fill="#34D399"/>
  <text x="325" y="313" fill="#34D399" font-family="system-ui" font-size="15" font-weight="bold">90° (b ⊥ c)</text>

  <!-- Conclusion: Parallel Chevrons & Arrows on a and b -->
  <path d="M 480 143 L 490 150 L 480 157 M 490 143 L 500 150 L 490 157" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 480 283 L 490 290 L 480 297 M 490 283 L 500 290 L 490 297" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <text x="515" y="225" fill="#F59E0B" font-family="system-ui" font-size="24" font-weight="800" filter="url(#glowCyan)">a ∥ b</text>

  <!-- Bottom Core Property Box -->
  <rect x="110" y="365" width="500" height="48" rx="14" fill="#062E20" fill-opacity="0.85" stroke="#10B981" stroke-width="2"/>
  <text x="360" y="396" fill="#D1FAE5" font-family="monospace, system-ui" font-size="18" font-weight="bold" text-anchor="middle">a ⊥ c   &amp;   b ⊥ c   ⟹   a ∥ b</text>
</svg>