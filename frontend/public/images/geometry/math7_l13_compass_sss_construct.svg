<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">SSS Compass Construction</title>
  <desc id="desc">Constructing triangle ABC with sides 6 cm, 5 cm, 4 cm using compass arcs</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="540" height="320" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.45"/>
  <rect x="102" y="12" width="335" height="26" rx="13" fill="#0F172A" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="270" y="29" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" letter-spacing="0.8">SECTOR 3 · SSS COMPASS CONSTRUCTION</text>
<path d="M 245 69 A 250 250 0 0 1 355 170" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,4"/>
<path d="M 275 110 A 200 200 0 0 1 360 64" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="6,4"/>
<polygon points="307.5,89.6 120,255 420,255" fill="rgba(6,182,212,0.12)" stroke="#38BDF8" stroke-width="3"/>
<text x="195" y="160" fill="#F59E0B" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end">5 cm</text>
<text x="380" y="160" fill="#34D399" font-family="monospace" font-size="14" font-weight="bold" text-anchor="start">4 cm</text>
<text x="270" y="276" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">6 cm</text>
<circle cx="307.5" cy="89.6" r="4.5" fill="#22D3EE"/>
<text x="307.5" y="73.6" fill="#FFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" dominant-baseline="central">A</text>
<circle cx="120.0" cy="255.0" r="4.5" fill="#22D3EE"/>
<text x="106.0" y="263.0" fill="#FFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="end" dominant-baseline="central">B</text>
<circle cx="420.0" cy="255.0" r="4.5" fill="#22D3EE"/>
<text x="434.0" y="263.0" fill="#FFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="start" dominant-baseline="central">C</text>
</svg>
