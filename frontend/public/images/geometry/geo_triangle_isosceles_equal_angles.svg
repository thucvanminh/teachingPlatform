<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 540 320" width="100%" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Geometric Diagram">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06B6D4" stroke-width="0.8" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="320" rx="18" fill="url(#cosmicBg)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.35" />
  <rect width="540" height="320" rx="18" fill="url(#radarGrid)" />

  <!-- Geometric Elements -->
  <polygon points="270.00,60.00 120.00,240.00 420.00,240.00" fill="rgba(56, 189, 248, 0.04)" stroke="#38BDF8" stroke-width="2.8" stroke-linejoin="round" />
  <line x1="270.00" y1="60.00" x2="270.00" y2="240.00" stroke="#C4B5FD" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4,4" />
  <circle cx="270.00" cy="240.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
  <circle cx="270.00" cy="240.00" r="4.5" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.5" />
  <text x="270.00" y="256.00" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">H</text>
  <path d="M 270.00 226.00 L 284.00 226.00 L 284.00 240.00" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1.8" stroke-linejoin="miter" stroke-linecap="square" />
  <line x1="191.16" y1="146.80" x2="198.84" y2="153.20" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
  <line x1="341.16" y1="153.20" x2="348.84" y2="146.80" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 139.21 216.95 A 30.00 30.00 0 0 1 150.00 240.00" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <line x1="144.00" y1="228.76" x2="150.34" y2="225.79" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
  <text x="161.66" y="220.49" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">70°</text>
  <path d="M 400.79 216.95 A 30.00 30.00 0 1 1 390.00 240.00" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
  <line x1="444.00" y1="251.24" x2="450.34" y2="254.21" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" />
  <text x="461.66" y="259.51" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" dominant-baseline="middle">70°</text>
  <circle cx="270.00" cy="60.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
  <circle cx="270.00" cy="60.00" r="4.5" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.5" />
  <text x="270.00" y="46.00" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">A</text>
  <circle cx="120.00" cy="240.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
  <circle cx="120.00" cy="240.00" r="4.5" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.5" />
  <text x="106.00" y="254.00" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">B</text>
  <circle cx="420.00" cy="240.00" r="8.10" fill="#22D3EE" opacity="0.35" filter="url(#nodeGlow)" />
  <circle cx="420.00" cy="240.00" r="4.5" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.5" />
  <text x="434.00" y="254.00" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">C</text>

  <!-- Schematic Watermark -->
  <text x="18" y="306" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1">SCHEMATIC · NOT TO SCALE</text>
</svg>