<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 285" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">V-Shaped Twin Right Triangles HL SBT 4.31d</title>
  <desc id="desc">V-shaped twin right triangles XYZ and TSZ on base X-Z-S with triple ticks on hypotenuses YZ=TZ and double ticks on legs XZ=SZ</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="540" height="285" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4"/>
  <g transform="translate(0, -20)">
  <!-- Base X-Z-S: X(110,245), Z(270,245), S(430,245) -->
  <!-- Y(110,95), T(430,95) -->
  <line x1="80" y1="245" x2="460" y2="245" stroke="#94A3B8" stroke-width="2"/>

  <path d="M 124.0 245.0 L 124.0 231.0 L 110.0 231.0" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 416.0 245.0 L 416.0 231.0 L 430.0 231.0" fill="none" stroke="#34D399" stroke-width="2"/>

  <polygon points="110,245 270,245 110,95" fill="rgba(56,189,248,0.12)" stroke="#38BDF8" stroke-width="2.6"/>
  <polygon points="430,245 270,245 430,95" fill="rgba(52,211,153,0.12)" stroke="#34D399" stroke-width="2.6"/>

  <!-- Legs XZ and SZ: 2 ticks -->
  <line x1="186.5" y1="238.0" x2="186.5" y2="252.0" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="193.5" y1="238.0" x2="193.5" y2="252.0" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="346.5" y1="238.0" x2="346.5" y2="252.0" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="353.5" y1="238.0" x2="353.5" y2="252.0" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Hypotenuses YZ and TZ: 3 ticks -->
  <line x1="191.9" y1="162.2" x2="182.3" y2="172.4" stroke="#FBBF24" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="194.8" y1="164.9" x2="185.2" y2="175.1" stroke="#FBBF24" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="197.7" y1="167.6" x2="188.1" y2="177.8" stroke="#FBBF24" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="357.7" y1="172.4" x2="348.1" y2="162.2" stroke="#FBBF24" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="354.8" y1="175.1" x2="345.2" y2="164.9" stroke="#FBBF24" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="351.9" y1="177.8" x2="342.3" y2="167.6" stroke="#FBBF24" stroke-width="2.0" stroke-linecap="round"/>

  <circle cx="110" cy="245" r="4.5" fill="#22D3EE"/><text x="95" y="258" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">X</text>
  <circle cx="270" cy="245" r="4.5" fill="#FBBF24"/><text x="270" y="265" fill="#FBBF24" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Z</text>
  <circle cx="430" cy="245" r="4.5" fill="#34D399"/><text x="444" y="258" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">S</text>
  <circle cx="110" cy="95" r="4.5" fill="#22D3EE"/><text x="95" y="90" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">Y</text>
  <circle cx="430" cy="95" r="4.5" fill="#34D399"/><text x="444" y="90" fill="#FFF" font-family="system-ui" font-size="14" font-weight="bold">T</text>
  </g>
</svg>