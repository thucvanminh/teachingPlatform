<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Three Triangle Congruence Cases Synthesis</title>
  <desc id="desc">Side-by-side comparison of SSS, SAS, and ASA triangle congruence criteria</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
  </defs>
  <rect width="540" height="320" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="95" y="14" width="350" height="28" rx="14" fill="#0F172A" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="270" y="33" fill="#E2E8F0" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">MASTER MATRIX · 3 CONGRUENCE CRITERIA</text>

  <!-- Card 1: SSS -->
  <rect x="20" y="58" width="156" height="232" rx="12" fill="rgba(15,23,42,0.75)" stroke="#38BDF8" stroke-width="1.4"/>
  <text x="98" y="82" fill="#38BDF8" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">1. SSS</text>
  <text x="98" y="99" fill="#94A3B8" font-family="system-ui" font-size="10.5" text-anchor="middle">Side - Side - Side</text>
  <polygon points="98,125 46,222 150,222" fill="rgba(56,189,248,0.14)" stroke="#38BDF8" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- 1 tick left, 2 ticks right, cross bottom -->
  <line x1="66" y1="170" x2="78" y2="177" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="118" y1="174" x2="130" y2="167" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="122" y1="181" x2="134" y2="174" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="93" y1="217" x2="103" y2="227" stroke="#FB7185" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="93" y1="227" x2="103" y2="217" stroke="#FB7185" stroke-width="2.2" stroke-linecap="round"/>
  <text x="98" y="254" fill="#E2E8F0" font-family="monospace" font-size="10.5" text-anchor="middle">All 3 pairs of</text>
  <text x="98" y="270" fill="#38BDF8" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">sides equal</text>

  <!-- Card 2: SAS -->
  <rect x="192" y="58" width="156" height="232" rx="12" fill="rgba(15,23,42,0.75)" stroke="#F59E0B" stroke-width="1.4"/>
  <text x="270" y="82" fill="#FBBF24" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">2. SAS</text>
  <text x="270" y="99" fill="#94A3B8" font-family="system-ui" font-size="10.5" text-anchor="middle">Side - Angle - Side</text>
  <!-- Included angle at bottom-left (218,222) -->
  <path d="M 218 222 L 244 222 A 26 26 0 0 0 230 199 Z" fill="rgba(245,158,11,0.28)"/>
  <path d="M 244 222 A 26 26 0 0 0 230 199" fill="none" stroke="#FBBF24" stroke-width="2.2"/>
  <polygon points="270,125 218,222 322,222" fill="rgba(245,158,11,0.1)" stroke="#FBBF24" stroke-width="2.4" stroke-linejoin="round"/>
  <line x1="238" y1="170" x2="250" y2="177" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="266" y1="215" x2="266" y2="229" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="274" y1="215" x2="274" y2="229" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>
  <text x="270" y="254" fill="#E2E8F0" font-family="monospace" font-size="10.5" text-anchor="middle">2 sides +</text>
  <text x="270" y="270" fill="#FBBF24" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">INCLUDED angle</text>

  <!-- Card 3: ASA -->
  <rect x="364" y="58" width="156" height="232" rx="12" fill="rgba(15,23,42,0.75)" stroke="#34D399" stroke-width="1.4"/>
  <text x="442" y="82" fill="#34D399" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">3. ASA</text>
  <text x="442" y="99" fill="#94A3B8" font-family="system-ui" font-size="10.5" text-anchor="middle">Angle - Side - Angle</text>
  <!-- Adjacent angles at (390,222) and (494,222) -->
  <path d="M 390 222 L 414 222 A 24 24 0 0 0 401 201 Z" fill="rgba(56,189,248,0.28)"/>
  <path d="M 414 222 A 24 24 0 0 0 401 201" fill="none" stroke="#38BDF8" stroke-width="2.2"/>
  <path d="M 494 222 L 483 201 A 24 24 0 0 0 470 222 Z" fill="rgba(52,211,153,0.28)"/>
  <path d="M 483 201 A 24 24 0 0 0 470 222" fill="none" stroke="#34D399" stroke-width="2.2"/>
  <path d="M 480 196 A 29 29 0 0 0 465 222" fill="none" stroke="#34D399" stroke-width="1.8"/>
  <polygon points="442,125 390,222 494,222" fill="rgba(52,211,153,0.12)" stroke="#34D399" stroke-width="2.4" stroke-linejoin="round"/>
  <line x1="442" y1="215" x2="442" y2="229" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/>
  <text x="442" y="254" fill="#E2E8F0" font-family="monospace" font-size="10.5" text-anchor="middle">1 side + 2</text>
  <text x="442" y="270" fill="#34D399" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">ADJACENT angles</text>
</svg>
