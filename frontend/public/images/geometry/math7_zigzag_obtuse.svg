<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Zig-Zag Path with Obtuse Angles</title>
  <desc id="desc">Rays Ax and By are parallel. Point O forms reflex or interior corner angle AOB with obtuse angles xAO and yBO.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="540" height="320" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Ray Ax (pointing right) -->
  <line x1="80" y1="70" x2="480" y2="70" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="70" r="4.5" fill="#FFFFFF"/>
  <text x="195" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">A</text>
  <text x="490" y="75" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">x</text>

  <!-- Ray By (pointing right) -->
  <line x1="80" y1="250" x2="480" y2="250" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="250" r="4.5" fill="#FFFFFF"/>
  <text x="195" y="275" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">B</text>
  <text x="490" y="255" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">y</text>

  <!-- Vertex O (to the left of A and B) -->
  <circle cx="100" cy="160" r="6" fill="#22D3EE" filter="url(#neonGlow)"/>
  <circle cx="100" cy="160" r="3" fill="#FFFFFF"/>
  <text x="75" y="165" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">O</text>

  <!-- Segments OA and OB -->
  <line x1="200" y1="70" x2="100" y2="160" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="250" x2="100" y2="160" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>

  <!-- Auxiliary Ray Ot through O parallel to Ax and By (pointing right) -->
  <line x1="100" y1="160" x2="480" y2="160" stroke="#34D399" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  <text x="490" y="165" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">t</text>
  <text x="240" y="150" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Auxiliary ray Ot ∥ Ax ∥ By</text>

  <!-- Obtuse angle xAO = 140° -->
  <path d="M 200 70 L 250 70 A 50 50 0 0 1 162 104 Z" fill="rgba(56,189,248,0.25)" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="220" y="105" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold">140°</text>

  <!-- Obtuse angle yBO = 130° -->
  <path d="M 200 250 L 250 250 A 50 50 0 0 0 162 216 Z" fill="rgba(245,158,11,0.25)" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="220" y="225" fill="#F59E0B" font-family="monospace" font-size="13" font-weight="bold">130°</text>

  <!-- Corner angle AOB arc -->
  <path d="M 100 160 L 126 137 A 35 35 0 0 1 126 183 Z" fill="rgba(236,72,153,0.3)" stroke="#F472B6" stroke-width="2"/>
  <text x="135" y="165" fill="#F472B6" font-family="monospace" font-size="14" font-weight="bold">∠AOB = ?</text>

  <!-- Header Banner -->
  <rect x="130" y="15" width="280" height="28" rx="14" fill="#0F172A" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="270" y="34" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ax ∥ By · FIND CORNER ANGLE ∠AOB</text>
</svg>
