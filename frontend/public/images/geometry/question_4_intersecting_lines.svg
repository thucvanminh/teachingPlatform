<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="280">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#03060D" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowCyanStart" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 6,1 L 1,4 L 6,7 Z" fill="#38BDF8" />
    </marker>
    <marker id="arrowCyanEnd" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 2,1 L 7,4 L 2,7 Z" fill="#06B6D4" />
    </marker>
    <marker id="arrowPurpleStart" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 6,1 L 1,4 L 6,7 Z" fill="#C084FC" />
    </marker>
    <marker id="arrowPurpleEnd" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 2,1 L 7,4 L 2,7 Z" fill="#818CF8" />
    </marker>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="536" height="316" rx="20" fill="url(#bgGrad)" stroke="#0E7490" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Subtle Coordinate Grid -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,4">
    <line x1="40" y1="80" x2="500" y2="80" />
    <line x1="40" y1="160" x2="500" y2="160" />
    <line x1="40" y1="240" x2="500" y2="240" />
    <line x1="150" y1="30" x2="150" y2="290" />
    <line x1="270" y1="30" x2="270" y2="290" />
    <line x1="390" y1="30" x2="390" y2="290" />
  </g>

  <!-- Title / Legend Banner -->
  <rect x="130" y="16" width="280" height="28" rx="8" fill="#0E2238" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.6" />
  <text x="270" y="35" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
    FIGURE: INTERSECTING LINES AB AND CD
  </text>

  <!-- Angle Arcs at Vertex O (270, 160) -->
  <!-- Arc for AOC (Angle ~50 deg): from (-1,0) to (-cos50, -sin50) -> from left to up-left -->
  <!-- Line AB: horizontal y=160. Ray OA is to the left (dx=-1, dy=0), Ray OB is to the right (dx=1, dy=0) -->
  <!-- Line CD: from (150, 50) to (390, 270). dx=240, dy=220. Angle ~42.5 deg. Ray OC is up-left (150,50), Ray OD is down-right (390,270). -->
  <!-- Ray OA: angle 180°. Ray OC: angle 222.5° (or 137.5° in standard polar from center). -->
  
  <!-- Highlighted Vertical Angle Arc AOC -->
  <path d="M 230,160 A 40,40 0 0,1 242.7,130.5" fill="none" stroke="#F59E0B" stroke-width="3" filter="url(#glow)" />
  <path d="M 230,160 A 40,40 0 0,1 242.7,130.5" fill="#F59E0B" fill-opacity="0.15" />
  
  <!-- Highlighted Vertical Angle Arc BOD (Opposite to AOC) -->
  <path d="M 310,160 A 40,40 0 0,1 297.3,189.5" fill="none" stroke="#F59E0B" stroke-width="3" filter="url(#glow)" />
  <path d="M 310,160 A 40,40 0 0,1 297.3,189.5" fill="#F59E0B" fill-opacity="0.15" />

  <!-- Linear Pair Arcs (Subtle cyan) -->
  <path d="M 242.7,130.5 A 40,40 0 0,1 310,160" fill="none" stroke="#06B6D4" stroke-width="1.8" stroke-dasharray="3,3" />
  <path d="M 297.3,189.5 A 40,40 0 0,1 230,160" fill="none" stroke="#06B6D4" stroke-width="1.8" stroke-dasharray="3,3" />

  <!-- Line 1: AB (Horizontal) -->
  <line x1="50" y1="160" x2="490" y2="160" stroke="url(#cyanLine)" stroke-width="3.5" marker-start="url(#arrowCyanStart)" marker-end="url(#arrowCyanEnd)" />

  <!-- Line 2: CD (Diagonal) -->
  <line x1="140" y1="41" x2="400" y2="279" stroke="url(#purpleLine)" stroke-width="3.5" marker-start="url(#arrowPurpleStart)" marker-end="url(#arrowPurpleEnd)" />

  <!-- Points and Labels -->
  <!-- Point A -->
  <circle cx="80" cy="160" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
  <text x="80" y="142" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">A</text>

  <!-- Point B -->
  <circle cx="460" cy="160" r="5" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2" />
  <text x="460" y="142" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">B</text>

  <!-- Point C -->
  <circle cx="170" cy="68" r="5" fill="#C084FC" stroke="#FFFFFF" stroke-width="2" />
  <text x="150" y="70" text-anchor="end" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">C</text>

  <!-- Point D -->
  <circle cx="370" cy="252" r="5" fill="#818CF8" stroke="#FFFFFF" stroke-width="2" />
  <text x="395" y="260" text-anchor="start" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">D</text>

  <!-- Intersection Node O -->
  <circle cx="270" cy="160" r="6" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)" />
  <text x="270" y="190" text-anchor="middle" fill="#FCD34D" font-family="system-ui, sans-serif" font-size="18" font-weight="900">O</text>

  <!-- Angle Indicator Notes -->
  <text x="215" y="140" text-anchor="end" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">∠AOC</text>
  <text x="325" y="185" text-anchor="start" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="12" font-weight="600">∠BOD</text>
  <text x="315" y="135" text-anchor="start" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="11" font-weight="500">∠BOC (linear pair)</text>
  <text x="225" y="195" text-anchor="end" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="11" font-weight="500">∠AOD (linear pair)</text>

</svg>
