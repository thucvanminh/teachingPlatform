<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Relations Between Perpendicularity and Parallelism</title>
  <desc id="desc">Two perpendiculars to a common line are parallel. A line perpendicular to one of two parallel lines is perpendicular to the other. Two lines parallel to a third line are mutually parallel.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Backdrop -->
  <rect width="540" height="320" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Left Column Card: Theorems 1 & 2 (Perpendicular Bridge) -->
  <rect x="20" y="20" width="240" height="280" rx="12" fill="#0C1B2E" fill-opacity="0.7" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="140" y="44" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PERPENDICULAR ⇄ PARALLEL</text>

  <!-- Transversal line c (vertical) in Left Card -->
  <line x1="80" y1="65" x2="80" y2="245" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
  <text x="75" y="260" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">c</text>

  <!-- Horizontal line a -->
  <line x1="45" y1="100" x2="235" y2="100" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="242" y="105" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">a</text>
  <!-- Right-angle symbol at (80, 100) top-right -->
  <path d="M 80 86 L 94 86 L 94 100" fill="none" stroke="#22D3EE" stroke-width="2"/>

  <!-- Horizontal line b -->
  <line x1="45" y1="180" x2="235" y2="180" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
  <text x="242" y="185" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">b</text>
  <!-- Right-angle symbol at (80, 180) top-right -->
  <path d="M 80 166 L 94 166 L 94 180" fill="none" stroke="#34D399" stroke-width="2"/>

  <!-- Left formulas -->
  <text x="140" y="218" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">a ⊥ c and b ⊥ c ⇒ a ∥ b</text>
  <text x="140" y="235" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Two ⊥ lines are parallel</text>
  <text x="140" y="270" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">a ∥ b and c ⊥ a ⇒ c ⊥ b</text>
  <text x="140" y="287" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Transversal perpendicular test</text>

  <!-- Right Column Card: Theorem 3 (Transitivity of Parallels) -->
  <rect x="280" y="20" width="240" height="280" rx="12" fill="#0C1B2E" fill-opacity="0.7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="400" y="44" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">TRANSITIVITY OF PARALLELS</text>

  <!-- Three parallel lines in Right Card -->
  <!-- Line a -->
  <line x1="305" y1="80" x2="495" y2="80" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 440 76 L 446 80 L 440 84" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <text x="502" y="85" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">a</text>

  <!-- Line c (middle reference line) -->
  <line x1="305" y1="140" x2="495" y2="140" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 440 136 L 446 140 L 440 144" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="502" y="145" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">c</text>

  <!-- Line b -->
  <line x1="305" y1="200" x2="495" y2="200" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 440 196 L 446 200 L 440 204" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="502" y="205" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">b</text>

  <!-- Right formulas -->
  <text x="400" y="235" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">a ∥ c and b ∥ c ⇒ a ∥ b</text>
  <text x="400" y="255" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Two lines parallel to a 3rd line</text>
  <text x="400" y="272" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">All three lines are mutually parallel</text>
  <text x="400" y="289" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">a ∥ b ∥ c</text>
</svg>
