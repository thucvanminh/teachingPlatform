<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Three Parallel Lines Cut by Transversal</title>
  <desc id="desc">Lines a, b, and c are parallel (a ∥ b ∥ c), intersected by transversal line d at nodes A, B, and C.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="540" height="320" rx="18" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Parallel Lines a, b, c -->
  <!-- Line a -->
  <line x1="40" y1="70" x2="490" y2="70" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <text x="500" y="75" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">a</text>
  <path d="M 420 66 L 426 70 L 420 74" fill="none" stroke="#38BDF8" stroke-width="2"/>

  <!-- Line b -->
  <line x1="40" y1="160" x2="490" y2="160" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
  <text x="500" y="165" fill="#34D399" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">b</text>
  <path d="M 420 156 L 426 160 L 420 164" fill="none" stroke="#34D399" stroke-width="2"/>

  <!-- Line c -->
  <line x1="40" y1="250" x2="490" y2="250" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <text x="500" y="255" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">c</text>
  <path d="M 420 246 L 426 250 L 420 254" fill="none" stroke="#F59E0B" stroke-width="2"/>

  <!-- Transversal line d -->
  <line x1="160" y1="290" x2="340" y2="30" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
  <text x="345" y="40" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">d</text>

  <!-- Node A on line a -->
  <circle cx="312" cy="70" r="5" fill="#22D3EE" filter="url(#neonGlow)"/>
  <text x="325" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">A</text>
  <!-- Angle A1 = 72° -->
  <path d="M 312 70 L 342 70 A 30 30 0 0 0 327 48 Z" fill="rgba(56,189,248,0.25)" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="350" y="60" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold">A₁=72°</text>

  <!-- Node B on line b -->
  <circle cx="250" cy="160" r="5" fill="#34D399" filter="url(#neonGlow)"/>
  <text x="262" y="155" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">B</text>
  <text x="210" y="190" fill="#34D399" font-family="monospace" font-size="13" font-weight="bold">B₃=?</text>

  <!-- Node C on line c -->
  <circle cx="188" cy="250" r="5" fill="#F59E0B" filter="url(#neonGlow)"/>
  <text x="200" y="245" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">C</text>
  <text x="145" y="240" fill="#F59E0B" font-family="monospace" font-size="13" font-weight="bold">C₂=?</text>

  <!-- Top Banner -->
  <rect x="135" y="15" width="270" height="28" rx="14" fill="#0F172A" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="270" y="34" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">a ∥ b ∥ c · TRANSITIVITY NETWORK</text>
</svg>
