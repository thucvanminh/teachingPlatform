<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="100%" height="100%" role="img" aria-label="Corresponding Angles">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0E172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="440" rx="20" fill="url(#bgGrad)" stroke="#0EA5E9" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Top Title Banner -->
  <rect x="160" y="18" width="400" height="36" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="360" y="42" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.5">CORRESPONDING ANGLES · F-SHAPE</text>

  <!-- F-Shape Neon Indicator -->
  <path d="M 420 70 L 260 370 M 420 140 L 590 140 M 345 280 L 520 280" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.15"/>

  <!-- Parallel Lines a and b -->
  <line x1="60" y1="140" x2="660" y2="140" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <text x="675" y="146" fill="#38BDF8" font-family="system-ui" font-size="20" font-weight="bold">a</text>

  <line x1="60" y1="280" x2="660" y2="280" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <text x="675" y="286" fill="#38BDF8" font-family="system-ui" font-size="20" font-weight="bold">b</text>

  <!-- Parallel Arrows Chevrons -->
  <path d="M 140 133 L 150 140 L 140 147 M 150 133 L 160 140 L 150 147" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 140 273 L 150 280 L 140 287 M 150 273 L 160 280 L 150 287" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Transversal line c -->
  <line x1="220" y1="390" x2="440" y2="50" stroke="#C084FC" stroke-width="3.5" stroke-linecap="round"/>
  <text x="450" y="58" fill="#C084FC" font-family="system-ui" font-size="20" font-weight="bold">c</text>

  <!-- Intersection Nodes -->
  <circle cx="382" cy="140" r="5.5" fill="#FFF"/>
  <text x="358" y="130" fill="#E2E8F0" font-family="system-ui" font-size="16" font-weight="bold">A</text>

  <circle cx="293" cy="280" r="5.5" fill="#FFF"/>
  <text x="269" y="270" fill="#E2E8F0" font-family="system-ui" font-size="16" font-weight="bold">B</text>

  <!-- Angle A1 (Top-Right) -->
  <path d="M 432 140 A 50 50 0 0 0 409 98 L 382 140 Z" fill="#38BDF8" fill-opacity="0.35" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 425 137 A 43 43 0 0 0 405 102" fill="none" stroke="#E0F2FE" stroke-width="1.5"/>
  <text x="445" y="116" fill="#38BDF8" font-family="system-ui" font-size="18" font-weight="800" filter="url(#glow)">∠A₁</text>

  <!-- Angle B1 (Top-Right) -->
  <path d="M 343 280 A 50 50 0 0 0 320 238 L 293 280 Z" fill="#38BDF8" fill-opacity="0.35" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 336 277 A 43 43 0 0 0 316 242" fill="none" stroke="#E0F2FE" stroke-width="1.5"/>
  <text x="356" y="256" fill="#38BDF8" font-family="system-ui" font-size="18" font-weight="800" filter="url(#glow)">∠B₁</text>

  <!-- Bottom Core Property Box -->
  <rect x="140" y="365" width="440" height="48" rx="14" fill="#032541" fill-opacity="0.8" stroke="#38BDF8" stroke-width="2"/>
  <text x="360" y="396" fill="#F8FAFC" font-family="monospace, system-ui" font-size="19" font-weight="bold" text-anchor="middle">a ∥ b  ⟹  ∠A₁ = ∠B₁</text>
</svg>